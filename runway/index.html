<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link
  href="https://fonts.googleapis.com/css2?family=Lato&family=Open+Sans&family=Roboto&display=swap"
  rel="stylesheet"/>  

  <title>Runway – myprojectRunway</title>
  <link rel="stylesheet" href="/stylecss/style.css" />
</head>
<body class="runway-page">
  <!-- NAV -->
  <nav class="site-nav" role="navigation" aria-expanded="false">
    <div id="hamburger" class="hamburger-icon" aria-label="Open menu">
      &#9776;
    </div>
    <div id="logoContainer" class="logo-container" tabindex="0">
      <h1>myprojectRunway</h1>
    </div>

    <!-- MOBILE DROPDOWN NAV -->
    <div class="mobile-dropdown-nav" id="mobileDropdown">
      <a href="/">Home</a>
      <a href="/about/">About</a>
      <a href="/contact/">Contact</a>
      <a href="/runway/">Runway</a>
      <a href="/terms/">Terms</a>
    </div>
  </nav>

  <!-- SIDENAV (desktop) -->
  <div id="sideNav" class="sidenav">
    <div class="closebtn" onclick="closeSideNav()">&times;</div>
    <a href="/">Home</a>
    <a href="/about/">About</a>
    <a href="/contact/">Contact</a>
    <a href="/runway/">Runway</a>
    <a href="/terms/">Terms</a>
  </div>
  
<main class="runway-main">
  <!-- Section 1: Modern Highlights -->
    <section class="runway-highlights">
      <h2 class="runway-section-title">Runway Highlights</h2>
      <div class="highlights-images-masonry">
        <img src="/assets/runway-assets/Modern-chain-white-suit.jpg" class="highlight-img img-1x" alt="">
        <img src="/assets/runway-assets/Modern-friends-smiling.jpg" class="highlight-img img-1-5x" alt="">
        <img src="/assets/runway-assets/Modern-man-eyes.jpg" class="highlight-img img-2x" alt="">
        <img src="/assets/runway-assets/Modern-man-smile-fall.jpg" class="highlight-img img-1x" alt="">
        <img src="/assets/runway-assets/Modern-redcar.jpg" class="highlight-img img-1x" alt="">
        <img src="/assets/runway-assets/Modern-single-woman-model.jpg" class="highlight-img img-1-5x" alt="">
        <img src="/assets/runway-assets/Modern-woman-laying.jpg" class="highlight-img img-2x" alt="">
        <img src="/assets/runway-assets/Modern-woman-model-city.jpg" class="highlight-img img-1x" alt="">
        <img src="/assets/runway-assets/Modern-woman-model-sitting.jpg" class="highlight-img img-1x" alt="">
        <img src="/assets/runway-assets/Modern-woman-posing-NY.jpg" class="highlight-img img-1-5x" alt="">
        <img src="/assets/runway-assets/Modern-women-indian.jpg" class="highlight-img img-2x" alt="">
        <img src="/assets/runway-assets/Modern-women-sun-bathing.jpg" class="highlight-img img-1x" alt="">
      </div>
      <div class="highlight-quote">
        <blockquote>“A modern view: find the new style”</blockquote>
      </div>
    </section>

  <!-- Section 2: Inspiration -->
    <section class="runway-inspire">
      <span class="company-label">myprojectRunway</span>
      <h2 class="inspire-quote">
        We inspire to be the world’s most exceptional fashion leader!
      </h2>
    </section>

  <!-- Section 3: Carousel Collections -->
<section class="carousel-collection-section">
  <div class="carousel-collection-title">Collections</div>
  <div class="carousel-track-wrapper">
    <button class="carousel-arrow left" aria-label="Prev">&#8249;</button>
    <div class="carousel-track" id="carouselTrack"></div>
    
    <button class="carousel-arrow right" aria-label="Next">&#8250;</button>
  </div>
</section>

<div id="highlightModal" class="modal-overlay" style="display:none;">
  <div class="modal-bg"></div>
  <img id="highlightModalImg" src="" alt="" />
  <button class="modal-close" aria-label="Close">&times;</button>
</div>

<div id="collectionModal" class="modal-overlay" style="display:none;">
  <div class="modal-bg"></div>
  <div class="collection-modal-inner">
    <button class="modal-close" aria-label="Close">&times;</button>
    <img id="collectionModalImg" src="" alt="">
    <div class="collection-modal-caption"></div>
    <div class="collection-modal-controls">
      <button class="carousel-arrow left" id="collectionModalPrev">&#8249;</button>
      <span id="collectionModalCount"></span>
      <button class="carousel-arrow right" id="collectionModalNext">&#8250;</button>
    </div>
  </div>
</div>



</main>

  <!-- FOOTER -->
  <footer id="siteFooter" class="footer-content">
    <p><span>© 2025 myprojectRunway – All Rights Reserved.</span></p>
  </footer>
  <script src="/js/script.js"></script>
  <script src="/js/runway.js"></script>
</body>
</html>
