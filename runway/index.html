<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link
  href="https://fonts.googleapis.com/css2?family=Lato&family=Open+Sans&family=Roboto&display=swap"
  rel="stylesheet"
/>  
  <title>Runway – myprojectRunway</title>
  <link rel="stylesheet" href="/stylecss/style.css" />
</head>
<body class="runway-page">
  <!-- NAV -->
  <nav class="site-nav" role="navigation" aria-expanded="false">
    <div id="hamburger" class="hamburger-icon" aria-label="Open menu">
      &#9776;
    </div>
    <div id="logoContainer" class="logo-container" tabindex="0">
      <h1>myprojectRunway</h1>
    </div>

    <!-- MOBILE DROPDOWN NAV (inside nav for top:100%) -->
    <div class="mobile-dropdown-nav" id="mobileDropdown">
      <a href="/">Home</a>
      <a href="/about/">About</a>
      <a href="/contact/">Contact</a>
      <a href="/runway/">Runway</a>
      <a href="/terms/">Terms</a>
    </div>
  </nav>

  <!-- SIDENAV (desktop) -->
  <div id="sideNav" class="sidenav">
    <div class="closebtn" onclick="closeSideNav()">&times;</div>
    <a href="/">Home</a>
    <a href="/about/">About</a>
    <a href="/contact/">Contact</a>
    <a href="/runway/">Runway</a>
    <a href="/terms/">Terms</a>
  </div>
  
  <main>
    <section class="runway-section" id="highlights">
      <h1>Highlights: Spring 2026 Menswear</h1>
      <div class="card-row">
        <div class="runway-card">
          <img src="/assets/runway/look1.jpg" alt="Look 1" />
          <div class="card-content">
            <h3>Global Spa Guide</h3>
            <p>Vogue's Global Spa Guide</p>
          </div>
        </div>
        <!-- Repeat for as many as you want -->
      </div>
    </section>
    <section class="runway-section" id="top-stories">
      <h2>Top Stories</h2>
      <div class="card-row">
        <!-- Static or dynamic cards here -->
      </div>
    </section>
    <section class="runway-section" id="featured">
      <h2>Featured (from Firestore)</h2>
      <div id="featured-gallery" class="card-row"></div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer id="siteFooter" class="footer-content">
    <p><span>© 2025 myprojectRunway – All Rights Reserved.</span></p>
  </footer>
  <script src="/js/script.js"></script>
  <script src="/js/runway.js"></script>
</body>
</html>
