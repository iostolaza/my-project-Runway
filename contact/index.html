<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link
  href="https://fonts.googleapis.com/css2?family=Lato&family=Open+Sans&family=Roboto&display=swap"
  rel="stylesheet"
/>
  <title>Contact – myprojectRunway</title>
  <link rel="stylesheet" href="/stylecss/style.css" />
</head>
<body class="contact-page">
  <!-- NAV -->
  <nav class="site-nav" role="navigation" aria-expanded="false">
    <div id="hamburger" class="hamburger-icon" aria-label="Open menu">
      &#9776;
    </div>
    <div id="logoContainer" class="logo-container" tabindex="0">
      <h1>myprojectRunway</h1>
    </div>

    <!-- MOBILE DROPDOWN NAV (inside nav for top:100%) -->
    <div class="mobile-dropdown-nav" id="mobileDropdown">
      <a href="/">Home</a>
      <a href="/about/">About</a>
      <a href="/contact/">Contact</a>
      <a href="/runway/">Runway</a>
      <a href="/terms/">Terms</a>
    </div>
  </nav>

  <!-- SIDENAV (desktop) -->
  <div id="sideNav" class="sidenav">
    <div class="closebtn" onclick="closeSideNav()">&times;</div>
    <a href="/">Home</a>
    <a href="/about/">About</a>
    <a href="/contact/">Contact</a>
    <a href="/runway/">Runway</a>
    <a href="/terms/">Terms</a>
  </div>

  <main>
    <!-- HEADER -->
    <div class="location-selection-container"></div>
  
    <!-- 1) FORM IN THE MIDDLE -->
    <section class="form-section">
        <div class="contact-form-container">
      <h2>Leave Us a Message</h2>
      <form>
        <div class="form-group">
          <div class="form-column">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" autocomplete="name" required />
          </div>
          <div class="form-column">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </div>
        </div>
        <div>
          <label for="message">Message</label><br/>
          <textarea id="message" name="message" rows="5" autocomplete="off" required></textarea>
        </div>
        <button type="submit">Submit</button>
      </form>
    </div>
  </section>
  
    <!-- 2) CONTACT DETAILS + MAP -->
    <section class="contact-and-map-container">
      <div class="contact-details">
        <h2>myprojectRunway</h2>
        <p>427 Teheran-ro, Gangnam District</p>
        <p>Seoul, South Korea</p>
        <p>Email: <a href="mailto:info@projectrunway.com">info@myprojectRunway.com</a></p>
        <p>Phone: +82 10 2275 5951</p>
      </div>

      <div class="map">
        <div id="map-canvas"></div>
      </div>
    </section>
  </main>
  
  <!-- FOOTER -->
  <footer id="siteFooter" class="footer-content">
    <p><span>© 2025 myprojectRunway – All Rights Reserved.</span></p>
  </footer>

  

  <!-- Script logic -->
  <script src="/js/script.js"></script>
  <script src="/js/contact-form.js" defer></script>
  <script src="/js/maps.js"></script>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCyVcOnzG2MJuvgG5q3T7OWUmimpotBsVE&callback=initMap" async defer></script>

  
</body>
</html>
