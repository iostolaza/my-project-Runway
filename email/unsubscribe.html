<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Unsubscribe from Emails – myprojectRunway</title>
  <meta name="viewport" content="width=600, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css?family=Garamond:400,700|PT+Serif:400,700|Inconsolata:400,700" rel="stylesheet">

</head>
<body>
  <h1>Unsubscribe</h1>
  <div id="form-container">
    <form id="unsubscribe-form" method="POST" action="/unsubscribe">
      <label for="email">Enter your email to unsubscribe:</label>
      <input type="email" id="email" name="email" required placeholder="you@email.com" />
      <button type="submit">Unsubscribe</button>
    </form>
  </div>
