<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Unsubscribe from Emails – myprojectRunway</title>
  <meta name="viewport" content="width=600, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css?family=Garamond:400,700|PT+Serif:400,700|Inconsolata:400,700" rel="stylesheet">
  <style>
    body {
      font-family: Garamond, 'PT Serif', Inconsolata, serif;
      background: #f9f9f9;
      color: #111;
      max-width: 480px;
      margin: 60px auto;
      padding: 32px 16px 16px 16px;
      border-radius: 14px;
      box-shadow: 0 6px 30px rgba(0,0,0,0.07);
    }
    h1 {
      font-size: 2em;
      font-weight: 700;
      text-align: center;
      margin-bottom: 24px;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin-top: 18px;
    }
    label {
      font-size: 1em;
      margin-bottom: 6px;
    }
    input[type="email"] {
      padding: 12px 12px;
      font-size: 1em;
      border: 1px solid #d2d2d2;
      border-radius: 7px;
      width: 100%;
      box-sizing: border-box;
      font-family: inherit;
    }
    button {
      background: #111;
      color: #fff;
      font-size: 1.1em;
      font-family: inherit;
      font-weight: 700;
      padding: 12px;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 6px;
    }
    button:hover {
      background: #1a56db;
    }
    .confirmation {
      background: #e6f5ea;
      color: #217a46;
      padding: 18px 14px;
      border-radius: 7px;
      margin-top: 22px;
      text-align: center;
      font-weight: 600;
      font-size: 1.1em;
    }
    .footer {
      text-align: center;
      margin-top: 44px;
      font-size: 0.96em;
      color: #999;
    }
    @media (max-width: 600px) {
      body { max-width: 99vw; margin: 12vw 2vw; }
    }
  </style>
</head>
<body>
  <h1>Unsubscribe</h1>
  <div id="form-container">
    <form id="unsubscribe-form" method="POST" action="/unsubscribe">
      <label for="email">Enter your email to unsubscribe:</label>
      <input type="email" id="email" name="email" required placeholder="you@email.com" />
      <button type="submit">Unsubscribe</button>
    </form>
  </div>
  <div class="footer">
    &copy; 2025 myprojectRunway<br>
    <a href="email/privacy.html" style="color:#999; text-decoration:underline;">Privacy Policy</a>
  </div>
  <script src="/email-form.js"></script>
</body>
</html>
