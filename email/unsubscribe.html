<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link
  href="https://fonts.googleapis.com/css2?family=Lato&family=Open+Sans&family=Roboto&display=swap"
  rel="stylesheet"
/> 
  <title>Unsubscribe – myprojectRunway</title>
  <link rel="stylesheet" href="/stylecss/style.css" />
</head>
<body class="unsubscribe-page">
  <!-- NAV, SIDENAV, etc. remain the same -->

  <main class="unsubscribe-main">
    <section class="unsubscribe-section">
      <h1>Unsubscribe from Emails</h1>
      <div class="unsubscribe-form-container">
        <form id="unsubscribe-form" method="POST" action="/unsubscribe">
          <label for="email">Your email address</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="you@email.com"
          />
          <button type="submit">Unsubscribe</button>
        </form>
      </div>
      <div class="unsubscribe-footer">
        &copy; <span id="currentYear"></span> myprojectRunway<br />
        <a href="/terms/">Privacy Policy</a>
      </div>
    </section>
  </main>

  <script src="/js/email-form.js"></script>
  <script>
    // dynamic year
    document.getElementById('currentYear').textContent = new Date().getFullYear();
  </script>
</body>
</html>
